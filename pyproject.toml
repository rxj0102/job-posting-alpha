[project]
name = "job-posting-alpha"
version = "0.1.0"
description = "Research code for job-posting-alpha"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "statsmodels>=0.14.0",
    "scipy>=1.11.0",
    "yfinance>=0.2.28",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "jupyter>=1.0.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "pytest>=7.0"
]

[dependency-groups]
dev = ["pytest>=7.4"]

[tool.uv]
package = false
